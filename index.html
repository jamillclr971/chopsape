<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E9ECF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1116" media="(prefers-color-scheme: dark)">
<meta name="description" content="Chop'Sape propose chaque jour une tenue selon la météo et votre garde-robe.">
<title>Chop'Sape</title>
<meta name="apple-mobile-web-app-title" content="Chop'Sape">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: une colonne mobile, en-tête collant avec deux onglets ; la tenue se lit comme une étiquette textile (pièces, relevé en clo, jauge). */
:root{
  --bg:#E9ECF1; --surface:#F6F7F9; --raised:#FFFFFF; --ink:#12151C; --ink2:#4B5363;
  --line:#CBD1DB; --tile:#DCE1E8; --accent:#2B45F5; --on-accent:#FFFFFF;
  --edge:rgba(18,21,28,.38); --cold:#3D7BFA; --warm:#F0A22E; --warn:#A8470F; --ok:#1B7F54;
  --shadow:0 1px 0 rgba(18,21,28,.06),0 10px 26px -14px rgba(18,21,28,.28);
  color-scheme:light;
  --display:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1116; --surface:#161A22; --raised:#1D222C; --ink:#EEF1F6; --ink2:#A3ACBB;
    --line:#2C3340; --tile:#262C38; --accent:#7C8DFF; --on-accent:#0E1116;
    --edge:rgba(238,241,246,.42); --cold:#5C95FF; --warm:#F0A22E; --warn:#F0A06B; --ok:#5CCB98;
    --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1116; --surface:#161A22; --raised:#1D222C; --ink:#EEF1F6; --ink2:#A3ACBB;
  --line:#2C3340; --tile:#262C38; --accent:#7C8DFF; --on-accent:#0E1116;
  --edge:rgba(238,241,246,.42); --cold:#5C95FF; --warm:#F0A22E; --warn:#F0A06B; --ok:#5CCB98;
  --shadow:0 1px 0 rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--display); font-size:15px; line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
  margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(32px + env(safe-area-inset-bottom,0px));
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.shell{max-width:620px;margin:0 auto}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);padding-block:14px 8px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{margin:0;font-size:27px;font-weight:800;font-stretch:125%;letter-spacing:-.01em;line-height:1}
.date{font-family:var(--mono);font-size:12px;color:var(--ink2);text-align:right}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:var(--tile);padding:3px;border-radius:10px;margin-top:12px}
.tabs button{min-height:40px;border:0;border-radius:8px;background:transparent;font-weight:650;color:var(--ink2)}
.tabs button[aria-selected="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.count{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:5px;background:var(--tile);font:500 11px/20px var(--mono);color:var(--ink2)}
.tabs button[aria-selected="true"] .count{background:var(--bg)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.panel-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
h2{margin:0;font-size:12px;font-weight:700;font-stretch:112%;letter-spacing:.09em;text-transform:uppercase}
.hint{font:400 11px var(--mono);color:var(--ink2)}
.stale{margin:4px 0 0;font:500 12px var(--mono);color:var(--warn)}

.place{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.place .btn{min-height:42px;padding:0 12px;font-size:14px}
.place-form{display:flex;gap:6px;margin:0 0 8px}
.place-form input{flex:1;min-width:0}
.place-form .btn{min-height:46px}
.chip .hint{font-weight:400}
.range-row{display:grid;grid-template-columns:78px minmax(0,1fr) 54px;align-items:center;gap:10px}
.range-row label{font-size:14px;font-weight:600}
.range-row output{font:500 14px var(--mono);text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:34px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--cold),var(--warm))}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--cold),var(--warm))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--raised);border:3px solid var(--ink);margin-top:-10px}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--raised);border:3px solid var(--ink)}

.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:7px;min-height:42px;padding:0 13px;border:1px solid var(--line);border-radius:8px;background:var(--raised);font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip svg{width:18px;height:18px;flex:none}
.ico{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.tag{margin-top:12px;background:var(--raised);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.tag-head{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px dashed var(--line);font:500 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.tag-head .done{color:var(--ok)}
.pieces{display:grid;gap:10px;padding:14px}
.pieces.c1{grid-template-columns:minmax(0,1fr)}
.pieces.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.pieces.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.piece{position:relative;min-width:0}
.art{aspect-ratio:1/1;max-width:100%;background:var(--tile);border-radius:6px;display:grid;place-items:center;overflow:hidden}
.art svg{width:74%;height:74%}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.cap{margin-top:6px;min-width:0}
.cap b{display:block;font-weight:650;font-size:13px;line-height:1.25;overflow-wrap:anywhere}
.cap span{display:block;font:400 11px/1.4 var(--mono);color:var(--ink2);overflow-wrap:anywhere}
.lock{position:absolute;top:6px;right:6px;width:38px;height:38px;display:grid;place-items:center;border-radius:7px;border:1px solid var(--line);background:var(--raised);opacity:.94}
.lock svg{width:18px;height:18px}
.lock[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);opacity:1}
.accs{display:flex;flex-wrap:wrap;gap:6px;padding:0 14px 14px}
.acc{display:flex;align-items:center;gap:8px;border:1px dashed var(--line);border-radius:7px;padding:4px 12px 4px 4px;font-size:13px;font-weight:600}
.acc .art{width:34px;aspect-ratio:1/1;border-radius:5px}
.acc .art svg{width:80%;height:80%}
.readout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px dashed var(--line);margin:0}
.readout div{padding:10px 12px 8px 14px;border-left:1px dashed var(--line);min-width:0}
.readout div:first-child{border-left:0}
.readout dt{font:400 10px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink2)}
.readout dd{margin:2px 0 0;font:500 17px var(--mono);font-variant-numeric:tabular-nums}
.readout dd small{font-size:11px;color:var(--ink2)}
.gauge{padding:4px 14px 12px}
.g-track{position:relative;height:26px}
.g-track::before{content:"";position:absolute;left:0;right:0;top:9px;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--warm),var(--cold))}
.mk-t{position:absolute;top:2px;width:3px;height:22px;margin-left:-1.5px;background:var(--ink);border-radius:2px}
.mk-o{position:absolute;top:4px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--raised);border:3px solid var(--ink)}
.g-scale{display:flex;justify-content:space-between;font:400 10px var(--mono);color:var(--ink2)}
.g-note{margin:8px 0 0;font:400 11px/1.5 var(--mono);color:var(--ink2)}
.why{list-style:none;margin:0;padding:6px 14px 4px;display:grid;gap:7px;font-size:14px}
.why li{position:relative;padding-left:16px}
.why li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;border-radius:2px;background:var(--accent)}
.why li.w{color:var(--warn)}
.why li.w::before{background:var(--warn)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px 14px}
.empty{padding:22px 16px;text-align:left}
.empty p{margin:0 0 12px}

.btn{min-height:46px;padding:0 16px;border-radius:9px;border:1px solid var(--line);background:var(--raised);font-weight:650;font-size:15px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--warn)}
.btn:disabled{opacity:.55;cursor:default}
.btn.block{width:100%}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px 10px;margin-top:12px}
.item{background:none;border:0;padding:0;text-align:left;position:relative;min-width:0}
.item .badge{position:absolute;top:5px;left:5px;padding:1px 6px;border-radius:4px;background:var(--raised);font:500 10px var(--mono);color:var(--ink2)}
.item .star{position:absolute;top:3px;right:6px;font-size:15px;color:var(--accent)}
.note{margin:12px 0 0;padding:12px 14px;border:1px dashed var(--line);border-radius:10px;font-size:14px;color:var(--ink2)}
.save-state{margin:18px 0 0;font:400 11px/1.5 var(--mono);color:var(--ink2)}

.sheet-wrap{position:fixed;inset:0;z-index:30;background:rgba(8,10,14,.58);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:620px;max-height:93%;overflow:auto;border-radius:14px 14px 0 0;
  padding:16px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.icon-btn{width:44px;height:44px;border-radius:9px;border:1px solid var(--line);background:var(--raised);display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}
.photo-row{display:grid;grid-template-columns:116px minmax(0,1fr);gap:14px;margin-top:14px;align-items:start}
.photo-row .art{width:116px}
.photo-side{display:grid;gap:8px;min-width:0}
.fld{display:grid;gap:8px;margin-top:16px;min-width:0}
.fld>label,.fld>.lab{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.fld .lab b{color:var(--ink);font-weight:500}
select,input[type=text]{width:100%;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:var(--raised);font-size:16px}
.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.sw{height:44px;border-radius:9px;border:1px solid var(--edge);padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:3px;background:var(--tile);padding:3px;border-radius:10px}
.seg button{min-height:42px;border:0;border-radius:8px;background:transparent;font-weight:650;font-size:14px;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--raised);color:var(--ink);box-shadow:var(--shadow)}
.togs{display:flex;flex-wrap:wrap;gap:8px}
.tog{display:inline-flex;align-items:center;gap:9px;min-height:46px;padding:0 14px;border:1px solid var(--line);border-radius:9px;background:var(--raised);font-weight:600}
.tog input{width:20px;height:20px;accent-color:var(--accent)}
.sheet-actions{display:grid;gap:8px;margin-top:22px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.photo-btn{display:flex;align-items:center;justify-content:center;text-align:center;min-height:46px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--raised);font-weight:650;cursor:pointer}
.sr:focus-visible+.photo-btn{outline:2px solid var(--accent);outline-offset:2px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;max-width:min(92vw,420px);
  background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:9px;font-size:14px;font-weight:600;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:up .18s ease-out}
  @keyframes up{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="brand"><h1>Chop'Sape</h1><span class="date" id="today"></span></div>
    <div class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" id="tab-today" data-act="tab" data-v="today" aria-selected="true" aria-controls="view-today">Aujourd'hui</button>
      <button role="tab" id="tab-closet" data-act="tab" data-v="closet" aria-selected="false" aria-controls="view-closet">Garde-robe<span class="count" id="count" hidden></span></button>
    </div>
  </header>

  <main id="main">
    <section id="view-today" role="tabpanel" aria-labelledby="tab-today">
      <div class="panel">
        <div class="panel-h"><h2>Météo du jour</h2><span class="hint" id="w-status"></span></div>
        <div class="place">
          <button class="btn" data-act="place" id="w-city" aria-expanded="false" aria-controls="place-form"><span id="w-name">Toulouse</span></button>
          <button class="btn" data-act="geo">Ma position</button>
          <button class="btn" data-act="refresh" aria-label="Actualiser la météo">Actualiser</button>
        </div>
        <form id="place-form" class="place-form" hidden><input type="text" id="w-q" placeholder="Ville" autocomplete="off" enterkeyhint="search" aria-label="Rechercher une ville"><button class="btn primary" type="submit">Chercher</button></form>
        <div class="chips" id="place-res" hidden style="margin:0 0 8px"></div>
        <div class="range-row"><label for="tmin">Matin</label><input type="range" id="tmin" min="-8" max="38" step="1"><output id="o-min" for="tmin"></output></div>
        <div class="range-row"><label for="tmax">Après-midi</label><input type="range" id="tmax" min="-8" max="38" step="1"><output id="o-max" for="tmax"></output></div>
        <p class="stale" id="stale" hidden></p>
        <div class="chips" id="cond" role="group" aria-label="Ciel"></div>
        <div class="chips" id="occ" role="group" aria-label="Occasion"></div>
      </div>
      <article class="tag" id="outfit" aria-live="polite"></article>
    </section>

    <section id="view-closet" role="tabpanel" aria-labelledby="tab-closet" hidden>
      <div class="panel" style="display:grid;gap:10px">
        <button class="btn primary block" data-act="add">Ajouter un vêtement</button>
        <div class="chips" id="filters" role="group" aria-label="Filtrer par catégorie" style="margin-top:0"></div>
      </div>
      <p class="note" id="demo-note" hidden></p>
      <div class="grid" id="grid"></div>
      <p class="save-state" id="save-state"></p>
      <div class="panel" style="display:grid;gap:10px">
        <h2>Sauvegarde</h2>
        <p class="hint" style="margin:0;line-height:1.5">Vos vêtements et photos restent dans ce navigateur, sur cet appareil. Exportez un fichier pour les conserver ou les passer sur un autre appareil.</p>
        <div class="actions" style="padding:0">
          <button class="btn" data-act="export">Exporter</button>
          <input class="sr" type="file" id="f-import" accept="application/json,.json">
          <label class="photo-btn" for="f-import">Importer</label>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="sheet-wrap" id="sheet-wrap" hidden>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script>

const state={items:[],prefs:{min:9,max:17,cond:'cloudy',occ:'casual',date:'',auto:false,place:{name:'Toulouse',lat:43.6047,lon:1.4442}},wstatus:'',results:[],view:'today',filter:'all',locks:new Set(),ideas:[],idx:0,backend:'memory',db:null};

/* ---------- Moteur de tenue ---------- */
function makeCtx(p){
  let t=p.min*.6+p.max*.4;
  if(p.cond==='sunny')t+=1.5;else if(p.cond==='rain')t-=1;else if(p.cond==='snow')t-=1.5;
  const occ=(OCCS.find(o=>o[0]===p.occ)||OCCS[0])[2];
  return {tEff:t,target:clamp(.4+(22-t)*.06,.25,2),spread:p.max-p.min,precip:p.cond==='rain'||p.cond==='snow',cond:p.cond,occ};
}
function hueDist(a,b){const d=Math.abs(a-b);return Math.min(d,360-d);}
function chromaOf(list){return list.filter(i=>i.type!=='jean'&&!COLOR[i.color].n);}
function colorScore(list){
  const ch=chromaOf(list).map(i=>COLOR[i.color]);let s=0;
  for(let a=0;a<ch.length;a++)for(let b=a+1;b<ch.length;b++){const d=hueDist(ch[a].hue,ch[b].hue);if(d<=30)s+=.5;else if(d>=150)s+=.2;else s-=1.4;}
  if(ch.length>=3)s-=1.2;
  const ks=list.map(i=>i.color),has=k=>ks.includes(k);
  if(has('noir')&&(has('marine')||has('marron')))s-=.5;
  if(ch.length===1&&list.length>=3)s+=.4;
  return s;
}
function varietyPen(i){const d=dayDiff(i.lastWorn);return d===1?1.2:(d===2||d===3)?.5:0;}
function scoreOutfit(o,ctx){
  const pcs=o.dress?[o.dress]:[o.top,o.bottom];
  const main=[...pcs,o.outer,o.shoes].filter(Boolean);
  let clo=.05;main.forEach(i=>{clo+=iclo(i);});
  let s=0;const diff=clo-ctx.target;s-=diff<0?-diff*4.5:diff*3;
  if(ctx.spread>=7&&ctx.tEff<21)s+=o.outer?.8:-.8;
  if(ctx.precip){
    if(o.outer)s+=o.outer.wp?1.5:-.5;else s-=1;
    if(o.shoes)s+=o.shoes.wp?1:(o.shoes.type==='sandales'?-2.5:-1.2);
    if(ctx.cond==='snow'&&o.shoes&&!o.shoes.wp)s-=1;
  }
  if(ctx.tEff>25){
    if(o.shoes&&o.shoes.type==='sandales')s+=.5;
    if(o.shoes&&o.shoes.type==='bottes')s-=2;
    if(o.bottom&&o.bottom.type==='short')s+=.4;
  }
  if(ctx.tEff<17&&o.bottom&&o.bottom.type==='short')s-=3.5;
  if(ctx.tEff<15&&o.shoes&&o.shoes.type==='sandales')s-=3;
  main.forEach(i=>{s-=1.1*Math.abs(i.f-ctx.occ);s-=varietyPen(i);if(i.fav)s+=.5;});
  s+=colorScore(main);
  return {s,clo};
}
function pickAcc(o,ctx,items){
  const want=[];
  if(ctx.tEff<8)want.push('echarpe');if(ctx.tEff<3)want.push('bonnet');if(ctx.tEff<2)want.push('gants');if(ctx.cond==='rain')want.push('parapluie');
  const base=[...(o.dress?[o.dress]:[o.top,o.bottom]),o.outer,o.shoes].filter(Boolean);const out=[];
  want.forEach(ty=>{
    const c=items.filter(i=>i.type===ty);if(!c.length)return;
    let best=null,bs=-1e9;
    c.forEach(i=>{const s=colorScore([...base,...out,i])-varietyPen(i)+(i.fav?.5:0);if(s>bs){bs=s;best=i;}});
    out.push(best);

}
const SLOTK=['top','bottom','dress','outer','shoes'];
const diffCount=(a,b)=>SLOTK.reduce((n,k)=>n+((a[k]?a[k].id:null)!==(b[k]?b[k].id:null)?1:0),0);
function buildIdeas(){
  const items=allItems(),ctx=makeCtx(state.prefs);
  const by=s=>items.filter(i=>TYPES[i.type]&&TYPES[i.type].s===s);
  let tops=by('top'),bottoms=by('bottom'),dresses=by('dress'),outers=by('outer'),shoes=by('shoes');
  const locked={};state.locks.forEach(id=>{const it=items.find(i=>i.id===id);if(it)locked[TYPES[it.type].s]=it;});
  const only=(list,s)=>locked[s]?[locked[s]]:list;
  tops=only(tops,'top');bottoms=only(bottoms,'bottom');dresses=only(dresses,'dress');outers=only(outers,'outer');shoes=only(shoes,'shoes');
  if(locked.dress){tops=[];bottoms=[];}else if(locked.top||locked.bottom){dresses=[];}
  const q=i=>(i.fav?.5:0)-varietyPen(i)-1.1*Math.abs(i.f-ctx.occ);
  const short=(list,s)=>{if(list.length<=16||locked[s])return list;return list.slice().sort((a,b)=>q(b)-q(a)).slice(0,16);};
  tops=short(tops,'top');bottoms=short(bottoms,'bottom');outers=short(outers,'outer');shoes=short(shoes,'shoes');
  const bases=[];
  tops.forEach(t=>bottoms.forEach(b=>bases.push({top:t,bottom:b})));
  dresses.forEach(d=>bases.push({dress:d}));
  const outerOpts=locked.outer?[locked.outer]:[null,...outers];
  const shoeOpts=shoes.length?shoes:[null];
  const res=[];
  bases.forEach(b=>outerOpts.forEach(out=>shoeOpts.forEach(sh=>{
    const o={top:b.top,bottom:b.bottom,dress:b.dress,outer:out,shoes:sh};const r=scoreOutfit(o,ctx);res.push({o,s:r.s,clo:r.clo});
  })));

  const picked=[];
  for(const r of res){if(picked.length>=8)break;if(picked.every(p=>diffCount(p.o,r.o)>=2))picked.push(r);}
  if(picked.length<4){for(const r of res){if(picked.length>=4)break;if(!picked.includes(r)&&picked.every(p=>diffCount(p.o,r.o)>=1))picked.push(r);}}
  const idOf=x=>x?x.id:null;
  return picked.map(r=>{
    const acc=pickAcc(r.o,ctx,items);
    return {o:{top:idOf(r.o.top),bottom:idOf(r.o.bottom),dress:idOf(r.o.dress),outer:idOf(r.o.outer),shoes:idOf(r.o.shoes)},acc:acc.map(a=>a.id),clo:r.clo+acc.reduce((s,a)=>s+iclo(a),0)};
  });
}

function colorNote(list){

function explain(pc,idea,ctx){

/* ---------- Persistance : IndexedDB dans le navigateur ---------- */
let idb=null;
function openDB(){return new Promise((res,rej)=>{
  if(!window.indexedDB){rej(new Error('idb'));return;}
  const r=indexedDB.open('chopsape',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('items',{keyPath:'id'});d.createObjectStore('meta');};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));
});}
function tx(store,mode,fn){return new Promise((res,rej)=>{
  if(!idb){res();return;}
  try{const t=idb.transaction(store,mode);fn(t.objectStore(store));t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);}catch(e){rej(e);}
});}
function upsert(it){const k=state.items.findIndex(x=>x.id===it.id);if(k>=0)state.items[k]=it;else state.items.unshift(it);}
let storageAsked=false;
async function writeItem(it){
  upsert(it);
  try{
    await tx('items','readwrite',s=>s.put(it));
    if(!storageAsked&&navigator.storage&&navigator.storage.persist){storageAsked=true;navigator.storage.persist().catch(()=>{});}
  }catch(e){toast('Enregistrement impossible : stockage du navigateur plein ou bloqué.');}
}
async function removeItem(id){
  state.items=state.items.filter(i=>i.id!==id);state.locks.delete(id);
  try{await tx('items','readwrite',s=>s.delete(id));}catch(e){}
}

/* ---------- Météo : Open-Meteo, sans clé ---------- */
function codeToCond(c,mm){
  if((c>=71&&c<=77)||c===85||c===86)return 'snow';
  if((c>=51&&c<=67)||(c>=80&&c<=82)||c>=95||mm>=1)return 'rain';
  if(c<=1)return 'sunny';
  return 'cloudy';
}
async function fetchWeather(){
  const pl=state.prefs.place;if(!pl)return;
  state.wstatus='Chargement…';syncWeather();
  try{
    const u='https://api.open-meteo.com/v1/forecast?latitude='+pl.lat+'&longitude='+pl.lon+'&daily=weather_code,apparent_temperature_max,apparent_temperature_min,precipitation_sum&timezone=auto&forecast_days=1';
    const r=await fetch(u);if(!r.ok)throw new Error('http');
    const d=(await r.json()).daily;
    Object.assign(state.prefs,{
      min:clamp(Math.round(d.apparent_temperature_min[0]),-8,38),max:clamp(Math.round(d.apparent_temperature_max[0]),-8,38),
      cond:codeToCond(d.weather_code[0],d.precipitation_sum[0]||0),date:todayISO(),auto:true
    });
    if(state.prefs.min>state.prefs.max)state.prefs.min=state.prefs.max;
    state.wstatus='Prévision du jour, réglable';
    savePrefsSoon();recompute();renderAll();
  }catch(e){state.wstatus='Météo indisponible : réglez-la à la main.';syncWeather();}
}
async function searchPlace(q){
  const box=$('#place-res');box.hidden=false;box.innerHTML='<span class="hint">Recherche…</span>';
  try{
    const r=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(q)+'&count=5&language=fr&format=json');
    const j=await r.json();
    state.results=(j.results||[]).map(x=>({name:x.name,lat:x.latitude,lon:x.longitude,sub:[x.admin1,x.country_code].filter(Boolean).join(', ')}));
    box.innerHTML=state.results.length?state.results.map((p,i)=>`<button class="chip" data-act="pickplace" data-i="${i}">${esc(p.name)} <span class="hint">${esc(p.sub)}</span></button>`).join(''):'<span class="hint">Aucun résultat.</span>';
  }catch(e){box.innerHTML='<span class="hint">Recherche impossible hors ligne.</span>';}
}
function geo(){
  if(!navigator.geolocation){toast('Position indisponible sur cet appareil.');return;}
  state.wstatus='Localisation…';syncWeather();
  navigator.geolocation.getCurrentPosition(
    p=>{state.prefs.place={name:'Ma position',lat:+p.coords.latitude.toFixed(3),lon:+p.coords.longitude.toFixed(3)};fetchWeather();},
    ()=>{state.wstatus='Position refusée. Cherchez une ville.';syncWeather();},
    {timeout:10000,maximumAge:600000}
  );
}

async function importData(file){

/* ---------- Photo : réduction et couleur dominante ---------- */
function processPhoto(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{
      try{
        let max=520,data='',c,w,h;
        for(let n=0;n<3;n++){
          const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
          w=Math.max(1,Math.round(img.naturalWidth*k));h=Math.max(1,Math.round(img.naturalHeight*k));
          c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
          data=c.toDataURL('image/jpeg',n?.65:.78);
          if(data.length<170000)break;max*=.75;
        }
        const s=24,c2=document.createElement('canvas');c2.width=s;c2.height=s;const x2=c2.getContext('2d');
        x2.drawImage(c,w*.28,h*.28,w*.44,h*.44,0,0,s,s);
        const px=x2.getImageData(0,0,s,s).data;let r=0,g=0,b=0,n=0;
        for(let i=0;i<px.length;i+=4){r+=px[i];g+=px[i+1];b+=px[i+2];n++;}
        r/=n;g/=n;b/=n;
        let best=COLORS[0],bd=1e12;
        COLORS.forEach(col=>{const d=(col.rgb[0]-r)**2+(col.rgb[1]-g)**2+(col.rgb[2]-b)**2;if(d<bd){bd=d;best=col;}});
        URL.revokeObjectURL(url);res({data,color:best.k});
      }catch(e){URL.revokeObjectURL(url);rej(e);}
    };
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('image'));};
    img.src=url;
  });
}
